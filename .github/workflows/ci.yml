name: CI

# Actions are pinned to commit SHAs, not tags: a tag is mutable, and whoever
# controls an action's repository can move it to different code inside a
# workflow that holds GITHUB_TOKEN and the build cache. The trailing comment
# on each line is the tag that SHA was resolved from, so bumping stays
# readable.

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Pint step below diffs against the base commit to find the
          # files this change adds, which needs more than a shallow clone.
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, bcmath, intl, zip
          # No coverage driver: see the --no-coverage note on the test step.
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Before composer install: its post-autoload-dump script runs
      # `artisan package:discover`, which boots the framework.
      - run: cp .env.example .env

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: php artisan key:generate

      # phpunit.xml pins the whole suite to an in-memory sqlite database, so
      # no service container is needed here.
      #
      # --no-coverage is required, not cosmetic: phpunit.xml configures
      # <coverage> reports, and with no driver installed PHPUnit aborts with
      # "No tests executed!" and a zero exit code -- a silently green build
      # that ran nothing.
      #
      # E2E is excluded here, not skipped anywhere: those suites compile and
      # run real submissions and need the fourteen language toolchains plus
      # bubblewrap, none of which a bare runner has. The judge-image job
      # below runs the whole suite, E2E included, in the image that does.
      - name: PHPUnit
        run: ./vendor/bin/phpunit --no-coverage --exclude-testsuite E2E

      # SAST. Level 0 found fifteen problems on its first run and every one
      # was real -- a relation on a live model pointing at a class that does
      # not exist, two env() calls that stop working once `config:cache`
      # runs, and three dead Laravel-5-era classes that could not be loaded
      # at all. None of them could fail a test, because none of them ran.
      #
      # No baseline, deliberately: everything it found was fixed instead.
      # A baseline says "these errors are acceptable" and then nobody reads
      # the list again. The level is pinned in phpstan.neon with the reason
      # for the number.
      - name: PHPStan
        run: composer analyse

      # Issue: SCA. The repository had no dependency audit anywhere -- not
      # in CI, not in a schedule -- so "are we shipping a known-vulnerable
      # package?" was a question nobody was asking. It is worth asking on a
      # contest server: it holds every team's source code, and a vulnerable
      # Laravel or Guzzle is a way into that.
      #
      # Measured before adding: at the time this was written, zero
      # advisories matched any installed version, npm and Composer alike.
      # The gate exists so that staying clean does not depend on someone
      # remembering to check.
      #
      # --locked audits the lock file rather than whatever happens to be in
      # vendor/, so this measures what actually deploys.
      #
      # --no-dev is the deliberate narrowing. A dev-only advisory (PHPUnit,
      # Pint, Whoops) is not reachable by a request to the running
      # application, and blocking a contest fix on one -- possibly the
      # morning of an event -- costs more than it protects. The dev half is
      # still reported, in the informational step below.
      #
      # --abandoned=ignore because an abandoned package is a maintenance
      # signal, not a vulnerability, and turning one into a red PR trains
      # people to ignore this step.
      - name: Dependency audit (production, blocking)
        run: composer audit --locked --no-dev --abandoned=ignore

      # Everything, dev included, reported and not enforced. Visible in the
      # log when someone goes looking, without the power to stop a release.
      - name: Dependency audit (including dev, informational)
        continue-on-error: true
        run: composer audit --locked --abandoned=report --format=summary

      # Scoped to files this change ADDS, deliberately. 278 of the repo's
      # 363 PHP files predate Pint, so a repo-wide --test fails today and
      # even an all-changed-files check would redden a PR over formatting it
      # inherited rather than wrote. New files have no such excuse.
      #
      # The path out is a one-off `./vendor/bin/pint` over the tree; after
      # that this becomes --diff-filter=ACMR, and eventually a plain
      # `./vendor/bin/pint --test`.
      - name: Laravel Pint (new files)
        run: |
          base='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit to diff against; skipping."
            exit 0
          fi

          files=$(git diff --name-only --diff-filter=A "$base" HEAD -- '*.php')

          if [ -z "$files" ]; then
            echo "No PHP files added."
            exit 0
          fi

          echo "$files"
          echo "$files" | xargs ./vendor/bin/pint --test

  # Issue #398. publiccode.yml is what public-software catalogues read, and
  # an invalid one is silently skipped by their crawlers -- nobody finds out.
  # The official validator runs here, pinned by version AND by SHA-256 (the
  # value from the release's checksums.txt), for the same reason the actions
  # above are pinned by commit: a release asset can be replaced.
  #
  # --no-network: the URL checks would make this job depend on github.com
  # answering during CI. The schema is what can regress in a PR; the URLs
  # are the repository's own.
  publiccode:
    name: publiccode.yml (validador oficial)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate publiccode.yml
        env:
          PARSER_VERSION: v5.4.3
          PARSER_SHA256: 211847305611417ac0b76af5169086232ea6c75ff6ae686227b6972a41599dd7
        run: |
          curl -fsSL -o parser.tar.gz \
            "https://github.com/italia/publiccode-parser-go/releases/download/${PARSER_VERSION}/publiccode-parser-go_Linux_x86_64.tar.gz"
          echo "${PARSER_SHA256}  parser.tar.gz" | sha256sum -c -
          tar xzf parser.tar.gz publiccode-parser
          ./publiccode-parser -no-network publiccode.yml

  judge-image:
    name: Judging (all languages, inside the sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, bcmath, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Before composer install: its post-autoload-dump script runs
      # `artisan package:discover`, which boots the framework.
      - run: cp .env.example .env

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: php artisan key:generate

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The image carries every toolchain the catalog marks is_active, plus
      # bubblewrap. The count is deliberately not written here any more: it
      # said "fourteen" while the catalog had sixteen entries, which is the
      # same drift issue #303 is about. The authority is
      # Language::getDefaultLanguages(), and
      # MultiLanguageJudgingTest::test_every_active_language_has_a_solution_fixture_covering_it
      # is what keeps the image and the catalog honest with each other.
      # Cached against the layer cache, so a run that doesn't touch
      # Dockerfile.judge doesn't pay for the Kotlin and Free Pascal
      # downloads again.
      - name: Build the judge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.judge
          tags: microhelium-judge:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image runs as its own `judge` user (uid 1000) while the runner
      # owns the checkout as a different uid, so every write the suite makes
      # under storage/ fails with "Permission denied" -- 241 errors, all of
      # them "could not be opened". Widening the directories the suite writes
      # to is the targeted fix; running the container as the runner's uid
      # instead would stop matching how docker-compose.yml actually runs the
      # autojudge service, which is the thing this job exists to verify.
      # Ubuntu 24.04 runners ship
      # kernel.apparmor_restrict_unprivileged_userns=1, and that policy is
      # enforced on the host, so it reaches processes inside the container
      # too: bwrap cannot create a user namespace and every sandbox test
      # skips itself. --fail-on-skipped is what turned that into a failure
      # instead of a green build over 48 silently skipped tests.
      #
      # `|| true` because neither knob exists on every runner image, and
      # their absence is not itself a problem -- whether the sandbox came up
      # is decided by --fail-on-skipped, not by these lines succeeding.
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Let the judge user write to the mounted workspace
        run: |
          chmod -R a+rwX storage bootstrap/cache
          chmod a+rwX .

      # --privileged matches how docker-compose.yml runs the autojudge
      # service, and is what lets bubblewrap create user namespaces. Since
      # #86 it carries a second load: Docker mounts /sys/fs/cgroup read-only
      # otherwise (moby#46763), and without a writable one the entrypoint
      # cannot delegate the cgroup v2 subtree the per-run memory cap needs.
      # The cgroup tests skip themselves when that delegation did not
      # happen, so --fail-on-skipped below is also what stops a silently
      # uncapped judge from passing as a green build.
      # The workspace is mounted over the image's own copy so the code under
      # test is this commit's, with the vendor tree installed above.
      #
      # --fail-on-skipped is the point of this job: the judging suites skip
      # themselves when no usable sandbox exists, so without it a broken
      # sandbox would show up as a green build that quietly tested nothing.
      - name: Full suite inside the judge image
        run: |
          docker run --rm --privileged \
            --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            -v "$PWD":/var/www/html \
            -w /var/www/html \
            microhelium-judge:ci \
            ./vendor/bin/phpunit --no-coverage --fail-on-skipped

      # Issue #194 -- o autoteste que a organizacao roda NA MAQUINA antes da
      # prova, rodado aqui dentro da imagem do juiz.
      #
      # A suite acima ja o exercita (JudgehostSelfTestCommandTest, e
      # --fail-on-skipped garante que ele nao se pule), mas como passo
      # proprio ele imprime o relatorio caso a caso no log. A diferenca
      # aparece no dia em que um kernel novo deixar de confinar alguma
      # coisa: em vez de uma asserção vermelha entre mil, o log diz qual
      # caso caiu e o que se esperava dele.
      - name: Autoteste do sandbox (issue #194)
        run: |
          docker run --rm --privileged \
            --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            -v "$PWD":/var/www/html \
            -w /var/www/html \
            -e AUTOJUDGE_USE_BWRAP=true \
            microhelium-judge:ci \
            php artisan judgehost:selftest

  # -------------------------------------------------------------------------
  # Issue #355 -- a imagem que julga PELA FILA passa a ser construida e
  # exercitada aqui.
  #
  # O job acima constroi o Dockerfile.judge. Nenhum job construia o
  # `Dockerfile` (aplicacao) nem o `Dockerfile.dev`, e os dois julgam:
  # docker-compose.yml roda a imagem da aplicacao nos servicos `queue` e
  # `scheduler`, e e la que JudgeRunJob -> AutoJudgeService::judge() compila
  # e executa codigo submetido. Uma instalacao que nao sobe o servico
  # `autojudge` -- e o compose de dev nao sobe (#282) -- julga TUDO por esse
  # caminho.
  #
  # O preco de nao construi-la ja foi medido duas vezes: #302 (Scratch e
  # Portugol Studio entraram so na imagem do juiz, e pela fila uma submissao
  # CORRETA virava CE) e #352 (a correcao da #301, idem: erro de execucao
  # continuava virando WA mudo, com a issue ja fechada). Nos dois casos a
  # descoberta foi manual, porque o CI nunca executava a imagem quebrada.
  # -------------------------------------------------------------------------
  docker-changes:
    # Por que um filtro de caminho, e nao uma construcao em todo PR: o job do
    # juiz ja leva ~16 min so construindo, a imagem da aplicacao tem ~2,2 GB,
    # e a classe de mudanca que causou a #302 e a #352 e estreita -- alguem
    # mexeu num Dockerfile ou no que ele copia para dentro da imagem. E o
    # caminho (2) da #355, o mais barato que ainda cobre os dois defeitos.
    #
    # O default na duvida e CONSTRUIR: sem commit base utilizavel (branch
    # nova, historico raso), a saida e `true`. Um filtro que erra para menos
    # reintroduz exatamente o silencio que esta issue documenta.
    name: Que mudanças podem afetar as imagens
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      imagens: ${{ steps.filtro.outputs.imagens }}
      perfis: ${{ steps.filtro.outputs.perfis }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # O passo abaixo compara com o commit base; um clone raso nao tem
          # com o que comparar.
          fetch-depth: 0

      - name: Comparar os caminhos tocados com o que entra nas imagens
        id: filtro
        run: |
          base='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Sem commit base utilizavel; construindo por seguranca."
            echo "imagens=true" >> "$GITHUB_OUTPUT"
            echo "perfis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A base de um PR e a ponta do branch base, que pode ter andado
          # desde o fork; sem o merge-base, commits de master entrariam no
          # diff como mudanca deste PR.
          base=$(git merge-base "$base" HEAD || echo "$base")

          # Dockerfile e Dockerfile.dev sao as duas imagens que ninguem
          # construia. Dockerfile.judge entra porque a paridade entre os tres
          # e o que a #353 passou a exigir, e mexer em um sem mexer nos
          # outros E a forma da #302. docker/ entra porque o entrypoint e os
          # .ini vao para dentro da imagem e decidem como ela julga;
          # resources/judge-runtime/ porque e o que os invocadores executam;
          # e este proprio arquivo, para que uma mudanca no job seja testada
          # pelo job.
          tocados=$(git diff --name-only "$base" HEAD -- \
            Dockerfile Dockerfile.dev Dockerfile.judge \
            docker/ resources/judge-runtime/ .github/workflows/ci.yml)

          if [ -n "$tocados" ]; then
            echo "Caminhos que entram nas imagens foram tocados:"
            echo "$tocados"
            echo "imagens=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum caminho que entra nas imagens foi tocado; a construcao abaixo nao roda."
            echo "imagens=false" >> "$GITHUB_OUTPUT"
          fi

          # Issue #306, passo 3 -- uma imagem por perfil muda com mais coisa
          # do que a imagem completa: o que ela instala sai do catalogo e do
          # manifesto (app/Models/Language.php, app/Support/Judge/), e o que
          # ela DECLARA sai da sonda. Uma linguagem ligada no catalogo move o
          # `completo` e regera os .corta -- que estao em docker/, entao o
          # filtro de cima ja pegaria --, mas uma mudanca so no que um perfil
          # promete (a lista `deGraca`, por exemplo) nao passaria por docker/.
          perfis=$(git diff --name-only "$base" HEAD -- \
            Dockerfile.judge docker/judge/ app/Models/Language.php \
            app/Support/Judge/ app/Services/Judgehost/MachineCapabilities.php \
            tests/E2E/PerfilDaImagemTest.php tests/E2E/MultiLanguageJudgingTest.php \
            tests/E2E/ToolchainVersionsMatchCatalogTest.php .github/workflows/ci.yml)

          if [ -n "$perfis" ]; then
            echo "Caminhos que mudam uma imagem por perfil foram tocados:"
            echo "$perfis"
            echo "perfis=true" >> "$GITHUB_OUTPUT"
          else
            echo "perfis=false" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------------
  # Issue #306, passo 3 -- a rede de regressao que a issue pediu: a suite
  # multi-linguagem rodada CONTRA CADA PERFIL, dentro da imagem construida com
  # ele. O perfil `completo` e o job `judge-image` acima (e o padrao do build,
  # e ele roda a suite inteira, inclusive o PerfilDaImagemTest).
  #
  # O que roda aqui e o que depende do perfil:
  #   - MultiLanguageJudging: cada linguagem que a imagem promete julga uma
  #     solucao certa como AC (a metade "esta imagem julga estas");
  #   - ToolchainVersionsMatchCatalog: a versao que o catalogo promete e a
  #     instalada, para as linguagens desta imagem;
  #   - PerfilDaImagem: a sonda encontra o prometido, nao declara nada alem, e
  #     a imagem nao recebeu ordem de instalar o que o perfil corta (a metade
  #     "e nao afirma julgar nenhuma outra").
  # O resto da suite nao muda de perfil para perfil, e ja roda no `completo`.
  # -------------------------------------------------------------------------
  judge-profile:
    name: Imagem do juiz por perfil (${{ matrix.perfil }})
    needs: docker-changes
    if: needs.docker-changes.outputs.perfis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        perfil: [maratona, scripting, funcional]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, bcmath, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - run: cp .env.example .env

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: php artisan key:generate

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Os estagios compilados (SWI-Prolog, G-Portugol, Portugol Studio...)
      # sao os mesmos em todo perfil, entao o cache do job `judge-image` os
      # serve; cada perfil guarda o proprio estagio final num escopo seu, para
      # que as tres matrizes nao se sobrescrevam.
      - name: Build the judge image (${{ matrix.perfil }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.judge
          build-args: JUDGE_PROFILE=${{ matrix.perfil }}
          tags: microhelium-judge:${{ matrix.perfil }}
          load: true
          cache-from: |
            type=gha
            type=gha,scope=judge-${{ matrix.perfil }}
          cache-to: type=gha,mode=max,scope=judge-${{ matrix.perfil }}

      # O numero que a #306 existe para mudar. Fica no log de todo PR que
      # mexe numa imagem, ao lado do `completo`, que o job `judge-image` nao
      # imprime mas qualquer um mede com o mesmo comando.
      - name: Tamanho da imagem
        run: |
          docker image inspect microhelium-judge:${{ matrix.perfil }} \
            --format '{{.Size}}' \
            | awk '{ printf "microhelium-judge:${{ matrix.perfil }}  %.1f MiB\n", $1 / 1048576 }'

      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Let the judge user write to the mounted workspace
        run: |
          chmod -R a+rwX storage bootstrap/cache
          chmod a+rwX .

      # Mesmos --privileged e --fail-on-skipped do job `judge-image`, pelo
      # mesmo motivo: um sandbox que nao subiu nao pode virar build verde.
      - name: Suíte por perfil dentro da imagem
        run: |
          docker run --rm --privileged \
            --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            -v "$PWD":/var/www/html \
            -w /var/www/html \
            microhelium-judge:${{ matrix.perfil }} \
            ./vendor/bin/phpunit --no-coverage --fail-on-skipped \
              --testsuite E2E \
              --filter 'MultiLanguageJudging|ToolchainVersionsMatchCatalog|PerfilDaImagem'

  app-image:
    name: Julgamento pela fila (imagem da aplicação)
    needs: docker-changes
    if: needs.docker-changes.outputs.imagens == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, bcmath, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Before composer install: its post-autoload-dump script runs
      # `artisan package:discover`, which boots the framework.
      - run: cp .env.example .env

      # Com as dependencias de desenvolvimento: a imagem da aplicacao roda
      # `composer install --no-dev`, entao o phpunit nao existe dentro dela.
      # Quem o fornece e o workspace montado no passo final, que e tambem o
      # que garante que o codigo sob teste seja o deste commit.
      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: php artisan key:generate

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # `scope` explicito: sem ele os dois jobs que constroem imagem dividem
      # o mesmo escopo de cache do GHA e um despeja o cache do outro a cada
      # corrida, fazendo as duas construcoes pagarem o download de toda a
      # cadeia de compiladores de novo.
      - name: Build the application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          tags: microhelium-app:ci
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # Mesmo motivo do job do juiz: o runner do Ubuntu 24.04 vem com
      # kernel.apparmor_restrict_unprivileged_userns=1, a politica vale no
      # host e alcanca o processo dentro do container, e sem isso o bwrap nao
      # cria namespace de usuario e todo teste de sandbox se pula. O `|| true`
      # e porque os botoes nao existem em toda imagem de runner; quem decide
      # se o sandbox subiu e o --fail-on-skipped, nao estas linhas.
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # A imagem roda como `www` (uid 1000) e o checkout pertence a outro uid.
      - name: Let the app user write to the mounted workspace
        run: |
          chmod -R a+rwX storage bootstrap/cache
          chmod a+rwX .

      # O ESCOPO.
      #
      # Roda o criterio de regressao que a #355 escreve: a suite
      # multi-linguagem contra a imagem da aplicacao. Sao os dois arquivos que
      # distinguiriam os dois defeitos -- MultiLanguageJudgingTest (a
      # submissao correta que virava CE, #302) e LanguageVerdictFidelityTest
      # (que compara VEREDITO, e nao presenca de arquivo: e ele que pega o WA
      # mudo da #352). Nao e a suite inteira de proposito: o que esta imagem
      # acrescenta ao que o job do backend ja cobre e o julgamento, e cada
      # corrida daqui paga uma construcao de ~2,2 GB.
      #
      # Do que o filtro seleciona, nada fica de fora. Ate a #356 fechar, dois
      # testes de memoria do PHP estavam nomeados num --exclude-filter e
      # rodavam a parte, sem poder reprovar o job:
      # docker/php/opcache.ini entrava no sandbox junto com o binario
      # (autojudge.sandbox_paths monta /usr) e os 256 MB do opcache saiam do
      # orcamento da submissao, entao um programa PHP correto recebia RE. O
      # #360 fechou a #356 desligando o opcache no run_command do catalogo, e
      # a exclusao sai junto: portao com excecao nomeada e portao que
      # envelhece calado -- foi exatamente assim que a #302 e a #352 passaram.
      #
      # Medido na imagem da aplicacao construida deste Dockerfile, com o
      # workspace montado, neste commit: 70 testes, 250 assercoes, 0 pulados.
      #
      # --privileged e os dois --security-opt sao os mesmos do job do juiz, de
      # proposito: assim a UNICA variavel entre os dois jobs e a imagem. Isso
      # nao afirma que a fila roda privilegiada -- o servico `queue` do
      # docker-compose.yml nao e privilegiado --; quem precisa de privilegio
      # aqui e o bwrap do runner. Medido sem --privileged nesta maquina: os
      # testes se pulam com "bubblewrap cannot create a sandbox here".
      #
      # --fail-on-skipped pelo mesmo motivo do job do juiz: sem ele, uma
      # imagem sem sandbox passaria como verde tendo executado nada.
      - name: Suíte multi-linguagem dentro da imagem da aplicação
        run: |
          docker run --rm --privileged \
            --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            -v "$PWD":/var/www/html \
            -w /var/www/html \
            microhelium-app:ci \
            ./vendor/bin/phpunit --no-coverage --fail-on-skipped \
              --testsuite E2E \
              --filter 'MultiLanguageJudging|LanguageVerdictFidelity'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # tests/Frontend/vue-loader.js uses module.registerHooks(), which
          # only exists from Node 22.15. On Node 20 features.test.js dies at
          # import time and eleven of the twenty-six tests never run.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Same split as the backend job above: production dependencies block,
      # the full tree is reported. --omit=dev because an advisory in vite or
      # playwright is a build-machine concern, not something a visitor to
      # the contest site can reach.
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (including dev, informational)
        continue-on-error: true
        run: npm audit

      - run: npm run test:frontend

      - name: Production asset build
        run: npm run build

  browser:
    # Issue #166: every Vue island in the application was dead in any built
    # deployment for weeks, and the whole suite stayed green. The PHP tests
    # assert on rendered HTML and the island markup rendered exactly as
    # expected; the Node tests import components directly, with no browser and
    # no CSP. The defect lived in the gap -- built assets executed under a real
    # Content-Security-Policy -- and only a browser can stand there.
    #
    # Deliberately not an end-to-end suite: three public pages, a check that an
    # island really mounted, and a check that the CSP is still being sent.
    # Runs in well under a minute once the browser is cached.
    name: Browser (built assets under the real CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, gd
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: cp .env.example .env

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: php artisan key:generate

      # A file, not :memory: -- `php artisan serve` is a separate process from
      # the migrate above, and an in-memory database does not survive the gap.
      - name: Prepare a throwaway database
        run: |
          touch database/browser.sqlite
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/browser.sqlite

      - run: npm ci

      # The subject of this job. Without it @vite() emits nothing usable and
      # every assertion below would be about an empty page.
      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:browser
        env:
          APP_ENV: local
          DB_CONNECTION: sqlite
          DB_DATABASE: database/browser.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
