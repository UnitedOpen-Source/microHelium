openapi: 3.0.3
info:
  title: microHelium API
  description: >
    HTTP API for microHelium, a Laravel-based ICPC-style contest judge.
    Covers every route currently registered in routes/api.php. This spec is
    hand-maintained against the Api\* controllers under
    app/Http/Controllers/Api -- tests/Feature/Api/OpenApiSpecTest.php checks
    every registered API route has a matching path documented here, so a new
    endpoint without a spec entry fails the suite.
  version: "1.0.0"
servers:
  - url: /api
security:
  - sanctum: []
tags:
  - name: Contests
  - name: Clarifications
  - name: Problems
  - name: Runs
  - name: Scoreboard
  - name: ManagedAccounts
  - name: Tokens
  - name: Misc
  - name: Webcast
  - name: Judgehost

paths:
  /user:
    get:
      tags: [Misc]
      summary: Get the authenticated user
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tokens:
    post:
      tags: [Tokens]
      summary: Exchange credentials for an API token
      description: >
        Issue #159 -- how a client that is not a browser gets in. Until this
        existed there was no way at all: the Sanctum token table was never
        migrated and nothing called createToken(), so every route in this
        document was unreachable by any real client.


        The shape is the one Laravel documents for CLI and mobile clients,
        and matches what DOMjudge's submit client does -- it authenticates
        with the user's own credentials rather than with a token an
        organiser has to mint per team.


        Unauthenticated by definition, and throttled at 5 requests a minute
        per address, the same as the web login. The `login` field takes
        either the account's e-mail or its username.


        A wrong password and an account that does not exist answer
        identically (422), deliberately: a participant list is public by
        nature and this route must not confirm which names on it are
        accounts. A disabled account (#47) and an account whose site pins an
        address range it is not calling from (#50) are refused with 403 --
        the second matters because without it this route would be the way
        around the site lock the web login enforces.


        The plain-text token is shown once and never again; only its sha256
        is stored. It expires after SANCTUM_TOKEN_MINUTES (default 30 days).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, device_name]
              properties:
                login:
                  type: string
                  description: The account's e-mail address or its username.
                password: { type: string, format: password }
                device_name:
                  type: string
                  description: >
                    Informational, and the handle the person uses later to
                    decide which token to revoke.
                  example: notebook-da-equipe
      responses:
        "201":
          description: A new token. The plain text appears in this response only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "3|k8sV..." }
                  name: { type: string }
                  abilities:
                    type: array
                    items: { type: string }
                  expires_at: { type: string, format: date-time, nullable: true }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      username: { type: string }
                      fullname: { type: string }
                      user_type: { type: string }
                      contest_id: { type: integer, nullable: true }
        "403":
          description: Account disabled, or calling from outside the site's allowed network
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many attempts
    get:
      tags: [Tokens]
      summary: List the caller's own API tokens
      description: >
        Never the token itself -- only its sha256 is stored, so there is
        nothing to show. `current` marks the token this request was
        authenticated with.
      responses:
        "200":
          description: The caller's tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiToken" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tokens/current:
    delete:
      tags: [Tokens]
      summary: Revoke the token this request is authenticated with
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "400":
          description: The request was not authenticated by a token (a session cookie has no token row)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tokens/{token}:
    delete:
      tags: [Tokens]
      summary: Revoke one of the caller's own tokens
      description: >
        Scoped to the caller's own tokens. Someone else's id answers 404,
        not 403: whether a given token id exists is not this caller's
        business either.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /contests:
    get:
      tags: [Contests]
      summary: List contests
      description: >
        Scoped by contest visibility (issue #134): staff see every contest,
        everyone else sees the contests they belong to plus those marked
        is_public. The technical practice contest is excluded for everyone.
      responses:
        "200":
          description: Paginated list of contests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedContests"
    post:
      tags: [Contests]
      summary: Create a contest
      description: >
        Also creates a default "Main Site", the contest's default languages,
        and default answers (accepted/wrong-answer/etc.).
        Admin only (issue #134): the contest lifecycle is
        administrative, the same way the /backend contest screens are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestCreate"
      responses:
        "201":
          description: Contest created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /contests/{contest}:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    get:
      tags: [Contests]
      summary: Get a contest
      description: >
        Scoped by contest visibility (issue #134): staff see everything,
        then a member of the contest, then everyone but only while the
        contest is_public. A contest you may not see answers 404 rather than
        403, so that an unannounced event is not discoverable by
        incrementing ids.
      responses:
        "200":
          description: The contest, with sites/languages/answers/problems loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Contests]
      summary: Update a contest
      description: >
        Admin only (issue #134): the contest lifecycle is
        administrative, the same way the /backend contest screens are.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestUpdate"
      responses:
        "200":
          description: Updated contest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Contests]
      summary: Partially update a contest
      description: >
        Admin only (issue #134): the contest lifecycle is
        administrative, the same way the /backend contest screens are.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestUpdate"
      responses:
        "200":
          description: Updated contest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Contests]
      summary: Delete a contest
      description: >
        Admin only (issue #134): the contest lifecycle is
        administrative, the same way the /backend contest screens are.
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  /contests/{contest}/activate:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    post:
      tags: [Contests]
      summary: Activate a contest
      description: >
        Admin only (issue #134): the contest lifecycle is
        administrative, the same way the /backend contest screens are.
      responses:
        "200":
          description: Contest activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  contest: { $ref: "#/components/schemas/Contest" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /contests/{contest}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    post:
      tags: [Contests]
      summary: Deactivate a contest
      description: >
        Admin only (issue #134): the contest lifecycle is
        administrative, the same way the /backend contest screens are.
      responses:
        "200":
          description: Contest deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  contest: { $ref: "#/components/schemas/Contest" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /contests/{contest}/status:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    get:
      tags: [Contests]
      summary: Get contest run/freeze status
      description: >
        Scoped by contest visibility (issue #134): staff see everything,
        then a member of the contest, then everyone but only while the
        contest is_public. A contest you may not see answers 404 rather than
        403, so that an unannounced event is not discoverable by
        incrementing ids.
      responses:
        "200":
          description: Contest status
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_active: { type: boolean }
                  is_running: { type: boolean }
                  is_frozen: { type: boolean }
                  start_time: { type: string, format: date-time, nullable: true }
                  end_time: { type: string, format: date-time, nullable: true }
                  contest_time: { type: integer }
                  duration: { type: integer }
                  freeze_time:
                    type: string
                    format: date-time
                    nullable: true
                    description: >
                      The scoreboard freeze cutoff timestamp
                      (end_time - freeze_time minutes), NOT the raw
                      freeze-time-in-minutes value -- Contest::freeze_time
                      is overridden by an accessor
                      (app/Models/Contest.php's getFreezeTimeAttribute()).
                      Null until the contest has a start_time.

  /clarifications/pending:
    get:
      tags: [Clarifications]
      summary: List pending clarifications
      description: >
        The judge queue: every unanswered question in the contest, whoever
        asked it. Judge/admin only (issue #134) -- it is not scoped to the
        caller the way GET /clarifications is.
      parameters:
        - $ref: "#/components/parameters/ContestIdQuery"
        - name: category
          in: query
          required: false
          description: >
            Issue #197 -- which desk. "My keyboard is broken" and "the
            statement of C is ambiguous" go to different people, and both
            used to land in one queue. A question about a problem is
            categorised by that problem (see problem_id); these three are
            the rest of the set the CCS requirements name.
          schema: { type: string, enum: [general, sysops, operations] }
        - name: problem_id
          in: query
          required: false
          description: Only questions about this problem.
          schema: { type: integer }
      responses:
        "200":
          description: >
            Pending clarifications, oldest first, with the jury's shortcuts.


            Issue #197 changed this from a bare array to an object. The
            predefined answers ride along with the queue rather than living
            on a route of their own: whoever opens the queue is exactly who
            uses them, and a second request for five fixed sentences would
            be work with no return.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Clarification"
                  predefined_answers:
                    type: array
                    description: >
                      The CCS requirements ask for these, including "No
                      comment, read problem statement." -- the first entry,
                      in Portuguese. Most contest questions are answered
                      with that sentence, and typing it forty times by hand
                      is how the clarification queue falls behind.
                    items: { type: string }
                  categories:
                    type: array
                    items: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /clarifications:
    get:
      tags: [Clarifications]
      summary: List clarifications
      description: >
        Teams only see their own clarifications plus anything with status
        broadcast_all, and broadcast_site only when the clarification's own
        site_id matches the viewer's -- a team at another site does not see
        it (app/Http/Controllers/Api/ClarificationController.php::index()).
        All of it scoped to contests the caller may see: a broadcast is
        public to its own contest, not to the installation (issue #134).
      parameters:
        - $ref: "#/components/parameters/ContestIdQuery"
      responses:
        "200":
          description: Paginated list of clarifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedClarifications"
    post:
      tags: [Clarifications]
      summary: Ask a clarification question
      description: >
        Fails with 422 if the contest is not currently running, and with 403
        if the caller does not compete in it (issue #134) -- seeing a public
        contest is not the same as taking part in it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contest_id, question]
              properties:
                contest_id: { type: integer }
                problem_id: { type: integer, nullable: true }
                question: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Clarification submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clarification"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /clarifications/{clarification}:
    parameters:
      - $ref: "#/components/parameters/ClarificationId"
    get:
      tags: [Clarifications]
      summary: Get a clarification
      description: 403 for a team's clarification that isn't theirs and isn't broadcast.
      responses:
        "200":
          description: The clarification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clarification"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Clarifications]
      summary: Soft-delete a clarification
      description: >
        Marks status "deleted" then removes the row.
        Judge/admin only (issue #134).
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  /clarifications/{clarification}/answer:
    parameters:
      - $ref: "#/components/parameters/ClarificationId"
    put:
      tags: [Clarifications]
      summary: Answer a clarification
      description: >
        Judge/admin only, and only for the judge's own contest --
        ClarificationController::answer() additionally refuses a judge from
        another contest with a 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, maxLength: 2000 }
                broadcast:
                  type: string
                  enum: [none, site, all]
                  nullable: true
      responses:
        "200":
          description: Answered clarification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clarification"
        "403":
          $ref: "#/components/responses/Forbidden"

  /problems:
    get:
      tags: [Problems]
      summary: List problems
      description: >
        Only problems of contests the caller may see (issue #134) -- the
        contest_id parameter is a filter the caller chooses, not the
        boundary.
      parameters:
        - $ref: "#/components/parameters/ContestIdQuery"
      responses:
        "200":
          description: Paginated list of problems (excludes fake/placeholder problems)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProblems"
    post:
      tags: [Problems]
      summary: Import a problem package
      description: >
        Judge/admin only (issue #134).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [contest_id, package]
              properties:
                contest_id: { type: integer }
                package: { type: string, format: binary, description: "A .zip problem package" }
                short_name: { type: string, maxLength: 10, nullable: true }
                color_name: { type: string, maxLength: 50, nullable: true }
                color_hex: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
                time_limit: { type: integer, minimum: 1, maximum: 60, nullable: true }
                memory_limit: { type: integer, minimum: 16, maximum: 2048, nullable: true }
      responses:
        "201":
          description: Imported problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /problems/{problem}:
    parameters:
      - $ref: "#/components/parameters/ProblemId"
    get:
      tags: [Problems]
      summary: Get a problem
      description: >
        Scoped by contest visibility (issue #134): staff see everything,
        then a member of the contest, then everyone but only while the
        contest is_public. A contest you may not see answers 404 rather than
        403, so that an unannounced event is not discoverable by
        incrementing ids.


        Carries counts only, never the test cases themselves (issue #153):
        each row held the case's path on disk plus input_hash/output_hash,
        and a sha256 of the hidden input lets a competitor verify a guessed
        input instead of having to solve the problem. The full rows are
        judge/admin only, at GET /problems/{problem}/test-cases.
      responses:
        "200":
          description: The problem, with test case / run / clarification counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Problems]
      summary: Update a problem
      description: >
        Judge/admin only (issue #134).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemUpdate"
      responses:
        "200":
          description: Updated problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Problems]
      summary: Partially update a problem
      description: >
        Judge/admin only (issue #134).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemUpdate"
      responses:
        "200":
          description: Updated problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Problems]
      summary: Delete a problem
      description: >
        Judge/admin only (issue #134).
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  /problems/{problem}/download:
    parameters:
      - $ref: "#/components/parameters/ProblemId"
    get:
      tags: [Problems]
      summary: Download the problem's statement file
      description: >
        The statement a competitor reads. Scoped by contest visibility
        (issue #134): unscoped, this served the statement of a contest that
        had not opened yet to anyone who guessed the problem id.
      responses:
        "200":
          description: The statement file (PDF/HTML/etc, as stored)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /problems/{problem}/export:
    parameters:
      - $ref: "#/components/parameters/ProblemId"
    get:
      tags: [Problems]
      summary: Export the full problem package as a zip
      description: >
        Judge/admin only (issue #134). A BOCA package carries input/ and
        output/ -- the hidden test data -- so this is not the endpoint a
        competitor reads a statement from; that is
        GET /problems/{problem}/download.
      responses:
        "200":
          description: A zip archive of the problem package
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"

  /problems/{problem}/test-cases:
    parameters:
      - $ref: "#/components/parameters/ProblemId"
    get:
      tags: [Problems]
      summary: List the problem's hidden test cases
      description: >
        Judge/admin only (issue #153). These rows name the input/output
        files on disk and carry their sha256 digests, which is an oracle a
        competitor can check a guessed input or output against -- the same
        material GET /problems/{problem}/export ships in full. They used to
        ride along in GET /problems/{problem}; that response now states
        test_cases_count and nothing more.
      responses:
        "200":
          description: The problem's test cases
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProblemTestCase" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs:
    get:
      tags: [Runs]
      summary: List runs
      description: Teams only see their own runs; admins/judges see everything.
      parameters:
        - $ref: "#/components/parameters/ContestIdQuery"
      responses:
        "200":
          description: Paginated list of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRuns"
    post:
      tags: [Runs]
      summary: Submit a run
      description: >
        Rejects submissions to a non-running contest, to a problem/language
        outside the contest, or a byte-identical resubmission (matched by
        SHA-256 of the source file) with 422, and a submission into a contest
        the caller does not compete in with 403 (issue #134). Dispatches
        JudgeRunJob when auto-judging is enabled for the problem/language.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [contest_id, problem_id, language_id, source_file]
              properties:
                contest_id: { type: integer }
                problem_id: { type: integer }
                language_id: { type: integer }
                source_file: { type: string, format: binary }
      responses:
        "201":
          description: Run submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /runs/{run}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      summary: Get a run
      description: 403 for another team's run.
      responses:
        "200":
          description: The run, with problem/language/answer/user/judge loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          $ref: "#/components/responses/Forbidden"

  /runs/{run}/source:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      summary: Download a run's submitted source file
      description: 403 for another team's run.
      responses:
        "200":
          description: The source file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{run}/rejudge:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      summary: Reset a run to pending and re-dispatch auto-judging
      description: >
        Intended for judges/admins, but RunController::rejudge() currently
        enforces no such check beyond auth:sanctum -- any authenticated
        user, including the submitting team, can call this. Tracked as a
        known authorization gap, not a documentation error.
      responses:
        "200":
          description: Run re-queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  run: { $ref: "#/components/schemas/Run" }

  /runs/{run}/judge:
    parameters:
      - $ref: "#/components/parameters/RunId"
    put:
      tags: [Runs]
      summary: Manually judge a run
      description: >
        Intended for judges/admins, but RunController::judge() currently
        enforces no such check beyond auth:sanctum -- any authenticated
        user, including the submitting team, can set the verdict and
        trigger a score update. Tracked as a known authorization gap, not
        a documentation error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer_id]
              properties:
                answer_id: { type: integer }
      responses:
        "200":
          description: Judged run, with score updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "422":
          $ref: "#/components/responses/ValidationError"

  /runs/{run}/verify:
    parameters:
      - $ref: "#/components/parameters/RunId"
    put:
      tags: [Runs]
      summary: Release a judged run's verdict to the team
      description: >
        Issue #138. The verification gate, modelled on DOMjudge: while the
        run's contest has verification_required set, a judged run's verdict
        is withheld from the team, from the scoreboard, from the balloon
        queue and from the webcast export until a jury member verifies it.
        Verifying records verified_at, verified_by and an optional
        verify_comment, then recomputes the team's score cell -- the run
        lands on the scoreboard with its ORIGINAL contest_time and the
        penalty that implies, not the time of verification.

        Judge/admin only (routes/api.php `role:judge,admin`), scoped to the
        caller's own contest.

        This endpoint deliberately accepts no answer_id. The verifier
        confirms or rejudges; it cannot change a colleague's verdict in
        place, because a verdict with two authors and a record of only one
        is the artifact an appeal cannot work with. A verifier who
        disagrees calls POST /runs/{run}/rejudge, which leaves a trail.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                verify_comment: { type: string, maxLength: 2000, nullable: true }
      responses:
        "200":
          description: Verified run, with the score recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          description: Caller is not a judge/admin, or the run is in another contest
        "422":
          description: The run has no verdict to verify yet
    delete:
      tags: [Runs]
      summary: Revoke a run's verification
      description: >
        Issue #138. The undo half. Clears verified_at/verified_by/
        verify_comment and recomputes the score cell, which withdraws the
        run from the standings again -- attempts and penalty included. A
        verification given in error has to be revocable, or the only way
        back is a rejudge that throws away a correct verdict.

        Judge/admin only, scoped to the caller's own contest.
      responses:
        "200":
          description: Run with its verification cleared and the score recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          description: Caller is not a judge/admin, or the run is in another contest

  /contests/{contest}/scoreboard:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    get:
      tags: [Scoreboard]
      summary: Get the contest scoreboard
      description: >
        Frozen (last freeze_time minutes hidden) for non-admins while the
        contest is frozen, and scoped by contest visibility (issue #134):
        a scoreboard is the contest's participants and how they are doing.
      responses:
        "200":
          description: Scoreboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreboardResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /contests/{contest}/my-score:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    get:
      tags: [Scoreboard]
      summary: Get the authenticated user's own score breakdown
      description: >
        Scoped by contest visibility (issue #134): staff see everything,
        then a member of the contest, then everyone but only while the
        contest is_public. A contest you may not see answers 404 rather than
        403, so that an unannounced event is not discoverable by
        incrementing ids.
      responses:
        "200":
          description: The caller's per-problem score breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyScoreResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /contests/{contest}/unfreeze:
    post:
      tags: [Contests]
      summary: Reveal the final standings (end the scoreboard freeze)
      description: >
        Issue #189 -- the ceremony. The freeze deliberately outlives the
        contest: the last hour it hides is revealed on stage, not by the
        clock running out. Before this existed, `isFrozen()` returned false
        the moment the contest ended, so the full final standings became
        public to teams and to anonymous visitors while the teams were still
        leaving the room.


        Admin only, and refused while the contest is still running --
        revealing then would publish the answers to a live contest.
        Idempotent: the button is pressed on a stage, and a second press
        must not read as a failure.


        Irreversible by design. Re-freezing after the room has seen the
        result would be theatre, not a correction.
      parameters:
        - name: contest
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The standings are released (or already were)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  unfrozen_at: { type: string, format: date-time, nullable: true }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The contest is still running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /contests/{contest}/scoreboard/export:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    get:
      tags: [Scoreboard]
      summary: Export the scoreboard
      description: >
        Judge/admin only (issue #134): unlike GET
        /contests/{contest}/scoreboard, this reads the standings with the
        freeze NOT applied, so it would hand a competitor exactly what the
        freeze exists to withhold.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, icpc], default: json }
      responses:
        "200":
          description: >
            The scoreboard export. Shape depends on `format`: the default
            `json` shape mirrors the live scoreboard; `icpc` returns a
            simplified rank/team/solved/time list.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ScoreboardExportJson"
                  - $ref: "#/components/schemas/ScoreboardExportIcpc"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contests/{contest}/statistics:
    parameters:
      - $ref: "#/components/parameters/ContestId"
    get:
      tags: [Scoreboard]
      summary: Get per-problem submission statistics
      description: >
        Judge/admin only (issue #134): solve counts here are read straight
        off the scores table, unaffected by the scoreboard freeze.
      responses:
        "200":
          description: Per-problem attempt/solve statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  contest_id: { type: integer }
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        problem_id: { type: integer }
                        short_name: { type: string }
                        name: { type: string }
                        color_hex: { type: string, nullable: true }
                        total_attempts: { type: integer }
                        solved_count: { type: integer }
                        attempted_count: { type: integer }
                        success_rate: { type: number }
                        first_solver: { type: integer, nullable: true }
        "403":
          $ref: "#/components/responses/Forbidden"

  /health:
    get:
      tags: [Misc]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /contest/current:
    get:
      tags: [Misc]
      summary: Get the currently active contest (for the countdown timer)
      security: []
      responses:
        "200":
          description: The active contest, or null if none is active
          content:
            application/json:
              schema:
                nullable: true
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  start_time: { type: string, format: date-time, nullable: true }
                  duration: { type: integer }
                  freeze_time: { type: integer }
                  is_running: { type: boolean }
                  is_frozen: { type: boolean }

  /frontend/webcast:
    get:
      tags: [Webcast]
      summary: Webcast export + credential management workspace (issue #44)
      description: >
        Session-authenticated admin endpoint (web guard + CSRF via
        routes/frontend_api_webcast.php, gated by ['auth','admin']) -- NOT
        Sanctum. Listed here only because this spec documents every
        registered /api/* route regardless of guard; see
        app/Http/Controllers/Frontend/WebcastController::index().
      security: []
      parameters:
        - $ref: "#/components/parameters/ContestIdQuery"
        - name: page
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Contests, selected contest, capabilities, export URL and paginated credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebcastWorkspace" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /frontend/managed-accounts:
    get:
      tags: [ManagedAccounts]
      summary: List managed accounts and their privacy status (issue #47)
      description: >
        Session + CSRF (web guard), NOT a sanctum bearer token -- registered
        in routes/frontend_api_managed_accounts.php, required from
        routes/web.php, so it is reachable at api/frontend/managed-accounts
        but authenticates like any other web route. Admin-only for this
        first delivery. Never returns birthdate, email, password or any
        activation token. See docs/specs/47-managed-accounts.md.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Administrative search by fullname/username.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Managed accounts, their privacy status, and the contests/sites available for creation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      capabilities:
                        type: object
                        properties:
                          can_create: { type: boolean }
                      contests:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            sites:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: integer }
                                  name: { type: string }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            fullname: { type: string }
                            username: { type: string }
                            contest_name: { type: string, nullable: true }
                            site_name: { type: string, nullable: true }
                            privacy_locked: { type: boolean }
                            visibility: { type: string, enum: [private, public] }
                            external_linking_allowed: { type: boolean }
                            privacy_reason: { type: string }
                      meta:
                        type: object
                        properties:
                          current_page: { type: integer }
                          last_page: { type: integer }
                          total: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ManagedAccounts]
      summary: Create a managed account (issue #47)
      description: >
        Creates a team account with no usable password and returns a
        one-time activation link (GET/POST /activate/{token}, also
        registered outside api/frontend and outside `auth` middleware).
        The account starts private, with external linking blocked, and
        stays that way regardless of a manipulated `visibility` or
        `user_type` in the request body, which are ignored. Requires an
        `Idempotency-Key` header; repeating the same key with the same
        payload replays the original response instead of creating a second
        account, and reusing the key with a different payload is a 409.
        See docs/specs/47-managed-accounts.md.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullname, username, contest_id, site_id]
              properties:
                fullname: { type: string, maxLength: 255 }
                username: { type: string, maxLength: 80 }
                birthdate:
                  type: string
                  format: date
                  nullable: true
                  description: "YYYY-MM-DD, or null when not informed. Never in the future."
                contest_id: { type: integer }
                site_id: { type: integer, description: "Must belong to contest_id." }
      responses:
        "201":
          description: Managed account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      activation_url:
                        type: string
                        nullable: true
                        description: One-time local activation link, e.g. /activate/{token}. Shown only in this response.
        "400":
          description: Missing Idempotency-Key header
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key reused with a different payload
        "422":
          $ref: "#/components/responses/ValidationError"

  /frontend/webcast/credentials:
    post:
      tags: [Webcast]
      summary: Issue a webcast credential (issue #44)
      description: >
        Session-authenticated admin endpoint, NOT Sanctum. The raw secret is
        returned exactly once, here, and never again in any later response
        (including an idempotent replay of this same call, which reports
        secret: null) -- see App\Models\WebcastCredential::issue() and
        App\Http\Controllers\Frontend\WebcastController::storeCredential().
        Idempotency handled by the shared App\Support\IdempotencyStore
        (issue #47); requires an `Idempotency-Key` header like every other
        mutating /api/frontend/* endpoint.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contest_id, label, expires_at]
              properties:
                contest_id: { type: integer }
                label: { type: string, minLength: 1, maxLength: 80 }
                expires_at: { type: string, format: date-time }
      responses:
        "201":
          description: Credential created (or, on an idempotent replay of the same key+payload, the same shape with secret null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      secret: { type: string, nullable: true, description: "The raw secret, present only in the response to the call that actually created the credential; null on any later idempotent replay." }
        "400":
          description: Missing Idempotency-Key header
        "422":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Idempotency-Key reused with a different payload, or a prior attempt with this key is still in flight

  /frontend/webcast/credentials/{id}:
    delete:
      tags: [Webcast]
      summary: Revoke a webcast credential (issue #44)
      description: >
        Session-authenticated admin endpoint, NOT Sanctum. Idempotent at
        the domain level -- revoking an already-revoked or nonexistent id
        still returns 200 -- in addition to going through
        App\Support\IdempotencyStore like every other mutating
        /api/frontend/* endpoint, so it also requires an `Idempotency-Key`
        header.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credential revoked (or already was)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      revoked: { type: boolean }
        "400":
          description: Missing Idempotency-Key header
        "403":
          $ref: "#/components/responses/Forbidden"

  /frontend/webcast/export:
    get:
      tags: [Webcast]
      summary: Download the BOCA-format webcast ZIP for a contest (issue #44)
      description: >
        Session-authenticated admin endpoint, NOT Sanctum. Gated off by
        config('webcast.export_enabled') (default false) until a real
        Animeitor consumer fixture confirms byte-format compatibility --
        see docs/specs/44-webcast.md. Returns 503 while disabled.
      security: []
      parameters:
        - $ref: "#/components/parameters/ContestIdQuery"
      responses:
        "200":
          description: application/zip attachment (contest, runs, version, time, icpc)
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Export not enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /webcast/scoreboard:
    get:
      tags: [Webcast]
      summary: Unfrozen scoreboard for a webcast credential's own contest (issue #44)
      description: >
        The ONLY route a webcast credential can reach -- registered outside
        both the `web` and `api` groups (see bootstrap/app.php and
        routes/webcast_consumer.php), authenticated by
        App\Http\Middleware\AuthenticateWebcastCredential, not by Sanctum or
        the web session. Rate-limited (throttle:20,1).
      security:
        - webcastCredential: []
      responses:
        "200":
          description: Live, unfrozen scoreboard for the credential's contest
          content:
            application/json:
              schema:
                type: object
                properties:
                  contest: { type: object, properties: { id: { type: integer }, name: { type: string } } }
                  generated_at: { type: string, format: date-time }
                  scoreboard:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer }
                        team_id: { type: integer }
                        team_name: { type: string }
                        problems_solved: { type: integer }
                        total_time: { type: integer }
        "401":
          description: Missing, invalid, expired, or revoked credential (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/register:
    post:
      tags: [Judgehost]
      summary: Announce a judge machine and release whatever it was still holding (issue #53)
      description: >
        Called by the judge agent at boot, after any endpoint error, and after
        a failed fetch. `reclaimed` is how many runs this host was still
        leased at the moment it spoke -- work it lost when it died, put back
        to `pending` by the only party that knows it was lost.
        Registered outside both the `web` and `api` groups (see
        bootstrap/app.php and routes/judgehost.php), authenticated by
        App\Http\Middleware\AuthenticateJudgehost, not by Sanctum or the web
        session. Rate-limited (throttle:120,1) -- looser than the webcast
        limit because polling is the normal mode of operation here.
      security:
        - judgehostToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                languages:
                  type: array
                  maxItems: 100
                  items: { type: string, maxLength: 20 }
                  description: >
                    Issue #117. The extensions this machine can actually run, derived by the
                    agent from the machine rather than configured. Replaces whatever it
                    declared before, so a runtime installed or removed is corrected by
                    restarting the agent. Omitting it leaves the host able to judge anything,
                    which is what agents older than #117 do.
                cpu_count:
                  type: integer
                  description: >
                    Recorded and surfaced to organisers, never used to route. Judging the
                    same submission on machines of different speeds makes TLE
                    non-deterministic, and the field's answer to that is uniform hardware --
                    ICPC's CCS requirements describe auto-judging machines identical to the
                    team machines -- not a per-host correction factor, which would hide the
                    problem rather than show it.
                memory_mb: { type: integer }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      judgehost:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                      reclaimed:
                        type: integer
                        description: Runs this host was holding that are now pending again
                      lease_seconds:
                        type: integer
                        description: How long a claim survives without a result before the server reaps it
                      languages:
                        type: array
                        items: { type: string }
                        description: What the server now believes this host can run (issue #117).
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/fetch-work:
    post:
      tags: [Judgehost]
      summary: Claim the next pending run, if there is one (issue #53)
      description: >
        Pull only -- nothing ever connects to a judge machine, which is the
        premise of the whole surface: a partner institution's judge needs no
        inbound port. The claim is taken under a row lock, so two hosts
        polling at the same instant cannot receive the same run. Stale leases
        are reaped on the way in, so a run abandoned by a dead host becomes
        available again without any cron running.
      security:
        - judgehostToken: []
      responses:
        "200":
          description: A run was claimed by this host
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id: { type: integer }
                      run_number: { type: integer }
                      contest_id: { type: integer }
                      claim_token:
                        type: string
                        description: >
                          Issue #123. The fencing token for THIS claim. Every later request
                          about this run must carry it in X-Claim-Token. Identity that stops
                          at "which machine" is not enough: two processes of one judgehost
                          present the same credential, so a hung agent that is restarted could
                          otherwise report over the run its own replacement is judging.
                      lease_expires_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: When this claim stops being current on its own.
                      lease_seconds: { type: integer }
                      problem:
                        type: object
                        properties:
                          id: { type: integer }
                          short_name: { type: string }
                          time_limit: { type: integer }
                          memory_limit: { type: integer }
                          test_case_count: { type: integer }
                          package:
                            type: object
                            description: >
                              Issue #120. Which of the problem's custom scripts apply to this
                              run's language, null where it does not override the hook. An
                              agent that sees a non-null hook MUST fetch it before judging, or
                              give the run back: AutoJudgeService applies each behind a
                              file_exists() that falls through to the default, so judging
                              without the compare script marks a correct submission WA in
                              silence.
                            properties:
                              compile: { $ref: "#/components/schemas/PackageScriptRef" }
                              run: { $ref: "#/components/schemas/PackageScriptRef" }
                              compare: { $ref: "#/components/schemas/PackageScriptRef" }
                      language:
                        type: object
                        properties:
                          id: { type: integer }
                          extension: { type: string }
                          compile_command: { type: string, nullable: true }
                          run_command: { type: string, nullable: true }
                      source:
                        type: object
                        properties:
                          filename: { type: string }
                          sha256: { type: string }
        "204":
          description: Nothing to judge -- the agent's signal to back off
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/runs/{run}/give-back:
    post:
      tags: [Judgehost]
      summary: Hand one claimed run back to the queue (issue #53)
      description: >
        For a host that knows it cannot finish a specific run -- a language it
        turned out not to have, a sandbox that refused to start. Better than
        holding it until the lease expires. A host may only speak about a run
        it is actually holding: the run's judgehost_id must be the caller's,
        otherwise 403.
      security:
        - judgehostToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
        - name: X-Claim-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Issue #123. The claim_token fetch-work returned for this run. A token from a
            claim that is over -- given back, expired, or superseded by a fresh claim -- is
            refused with 403 even when it comes from the machine the run is assigned to.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [linguagem_ausente, pacote_indisponivel, sandbox_falhou, transferencia_corrompida, nao_informado]
                  description: >
                    Issue #125. Why this machine could not finish. A closed set, because the
                    point is for an organiser to tell "nobody here has Kotlin installed" from
                    "the network is dropping test data", and free text does not aggregate.
                detail:
                  type: string
                  maxLength: 500
                  description: Human-readable detail, logged alongside the reason.
      responses:
        "200":
          description: The run is pending again
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id: { type: integer }
                      status: { type: string, example: pending }
                      reason: { type: string }
                      attempts:
                        type: integer
                        description: How many times this run has been handed back in total.
                      needs_attention:
                        type: boolean
                        description: >
                          Issue #125. True once the run has been refused enough times that it
                          stops being offered to judgehosts and is logged as an error rather
                          than a warning. It stays available to the local worker, which has
                          the problem package a remote host may be missing.
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: This run is not assigned to the calling judgehost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: No such run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /contests/{contest}/rejudgings:
    get:
      tags: [Rejudgings]
      summary: Lista os rejulgamentos em lote deste contest
      description: |
        Issue #192. Apenas juiz/admin: a previa de um conjunto mostra o
        veredito que cada equipe teria, isto e, a classificacao inteira
        antes de ela existir.
      security:
        - sanctum: []
      parameters:
        - name: contest
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Os conjuntos, do mais recente para o mais antigo
        '403':
          description: Um token de equipe nao chega aqui
    post:
      tags: [Rejudgings]
      summary: Monta um conjunto de rejulgamento e manda julgar em segundo plano
      description: |
        Issue #192, e os requisitos de CCS: "The CCS must support rejudging
        of submissions, selected by any combination of: submission, problem,
        language, team, time range, judgement, and judging machine."

        Criar o conjunto NAO muda veredito nenhum. Cada membro e julgado
        fora do run, o resultado fica guardado, e a equipe continua vendo o
        que ja via ate que alguem aplique.

        `reason` e obrigatorio: um rejulgamento em lote muda a classificacao
        de gente que nao pediu nada, e "por que" e a primeira pergunta de
        quem contesta o resultado depois.

        Envios ACEITOS ficam de fora por padrao. Tirar um AC de uma equipe
        no meio da prova e a coisa mais cara que um rejulgamento faz, e
        quase nunca e o que se queria ao pedir "rejulgue o problema C";
        incluir exige `include_accepted: true`.
      security:
        - sanctum: []
      parameters:
        - name: contest
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 255 }
                include_accepted: { type: boolean, default: false }
                run_ids:
                  type: array
                  items: { type: integer }
                problem_id: { type: integer, nullable: true }
                language_id: { type: integer, nullable: true }
                user_id: { type: integer, nullable: true }
                site_id: { type: integer, nullable: true }
                judgehost_id: { type: integer, nullable: true }
                answer_id:
                  type: integer
                  nullable: true
                  description: O veredito ATUAL do envio, nao o esperado
                contest_time_from:
                  type: integer
                  nullable: true
                  description: |
                    Segundos de tempo de PROVA, a mesma unidade de
                    runs.contest_time. Horario de parede seria outra coisa:
                    dois envios com o mesmo contest_time podem ter chegado
                    em dias diferentes depois de uma importacao.
                contest_time_to: { type: integer, nullable: true }
      responses:
        '201':
          description: O conjunto, com os membros ja materializados
        '403':
          description: Um token de equipe nao chega aqui
        '422':
          description: Faltou o motivo, ou um filtro aponta para algo que nao existe
  /contests/{contest}/rejudgings/dry-run:
    post:
      tags: [Rejudgings]
      summary: Quantos envios um criterio pega, sem criar conjunto nenhum
      description: |
        Issue #192. Existe separado porque montar um conjunto dispara
        julgamento de verdade: descobrir que o filtro pegou 4000 envios em
        vez de 40 depois de a fila ja estar cheia e tarde. Aqui e so uma
        contagem.

        `accepted_excluded` diz quantos envios aceitos o padrao deixou de
        fora, para que a decisao de incluir seja tomada com o numero na
        frente.
      security:
        - sanctum: []
      parameters:
        - name: contest
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_accepted: { type: boolean, default: false }
                problem_id: { type: integer, nullable: true }
                language_id: { type: integer, nullable: true }
                user_id: { type: integer, nullable: true }
                site_id: { type: integer, nullable: true }
                judgehost_id: { type: integer, nullable: true }
                answer_id: { type: integer, nullable: true }
                contest_time_from: { type: integer, nullable: true }
                contest_time_to: { type: integer, nullable: true }
      responses:
        '200':
          description: A contagem
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches: { type: integer }
                  accepted_excluded: { type: integer }
                  include_accepted: { type: boolean }
        '403':
          description: Um token de equipe nao chega aqui
  /rejudgings/{rejudging}:
    get:
      tags: [Rejudgings]
      summary: O conjunto e a previa do efeito de aplica-lo
      description: |
        Issue #192, e o segundo requisito de CCS: "It must be possible to
        preview the effect of a rejudgement without committing to it."

        `preview.changes` conta quantos vereditos mudariam. Um membro que
        ainda nao rodou, ou que falhou, NAO conta: a previa diz o que
        mudaria, e um julgamento que nao aconteceu nao tem opiniao sobre
        isso.
      security:
        - sanctum: []
      parameters:
        - name: rejudging
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: O conjunto e a previa
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejudging: { type: object }
                  preview:
                    type: object
                    properties:
                      total: { type: integer }
                      judged:
                        type: integer
                        description: So os que produziram veredito -- erros nao entram
                      errors: { type: integer }
                      changes: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            run_id: { type: integer }
                            run_number: { type: integer, nullable: true }
                            from: { type: string, nullable: true }
                            to: { type: string, nullable: true }
                            changes: { type: boolean }
                            error: { type: string, nullable: true }
        '403':
          description: Um token de equipe nao chega aqui
  /rejudgings/{rejudging}/apply:
    post:
      tags: [Rejudgings]
      summary: Grava os vereditos novos do conjunto inteiro
      description: |
        Issue #192. So um conjunto pronto -- todos os membros julgados --
        pode ser aplicado: gravar os ja julgados e deixar o resto para tras
        seria meio conjunto, que e exatamente o que "aplicavel como
        conjunto" existe para impedir.

        Os vereditos ANTIGOS nao sao apagados: ficam nas linhas do conjunto,
        e e o que permite responder depois o que aquele lote fez. O
        rejulgamento de um envio so (`POST /runs/{run}/rejudge`) apaga.

        Um membro que FALHOU fica como estava. Trocar um veredito real por
        uma falha de infraestrutura seria a equipe pagando por um defeito
        nosso.

        Toda verificacao (#138) dos envios tocados e revogada: a assinatura
        que liberou o veredito anterior foi dada sobre outro julgamento,
        possivelmente contra outros casos de teste.

        Durante o congelamento aplicar e permitido, e a razao esta em
        docs/specs/192-rejulgamento.md: so celulas ANTERIORES ao corte
        mudam, e aquelas ja eram publicas. Um envio feito durante o
        congelamento continua invisivel, com veredito novo ou velho.
      security:
        - sanctum: []
      parameters:
        - name: rejudging
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Aplicado
        '403':
          description: Um token de equipe nao chega aqui
        '422':
          description: O conjunto nao esta pronto, ou ja foi decidido
  /rejudgings/{rejudging}/cancel:
    post:
      tags: [Rejudgings]
      summary: Descarta o conjunto sem tocar em envio nenhum
      description: |
        Issue #192. Nao ha nada para desfazer, e esse e o desenho: enquanto
        o conjunto nao foi aplicado, os envios nunca sairam do estado em que
        estavam.
      security:
        - sanctum: []
      parameters:
        - name: rejudging
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cancelado
        '403':
          description: Um token de equipe nao chega aqui
        '422':
          description: O conjunto ja foi aplicado ou cancelado
  /remote-judges/v1/languages:
    get:
      tags: [Judgehost]
      summary: The languages this installation can ask a judge machine to run (issue #117)
      description: >
        So an agent can find out which of them it actually has. The commands are included
        because that is what the agent probes -- the executable each one starts with.
        Extensions alone would make it guess which binary "kt" implies, and guessing is
        what a configured list already does badly.
        Scoped to a valid judgehost credential but not to any run: a host needs this before
        it has claimed anything. It exposes no submission and no test data, only how this
        installation builds and runs each language.
      security:
        - judgehostToken: []
      responses:
        "200":
          description: The languages of every active contest, one entry per extension
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        extension: { type: string }
                        compile_command: { type: string, nullable: true }
                        run_command: { type: string, nullable: true }
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/runs/{run}/source:
    get:
      tags: [Judgehost]
      summary: The source file of a held run (issue #53)
      description: >
        Streamed as octet-stream rather than base64 in JSON: a source file is
        already at the submission size limit and encoding it inflates it by a
        third for no gain. `X-Source-Sha256` repeats the digest fetch-work
        gave, so the agent can verify what it received.
        Scoped to the machine currently holding the run -- not to one that
        held it earlier. Giving a run back gives up its source with it.
      security:
        - judgehostToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
        - name: X-Claim-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Issue #123. The claim_token fetch-work returned for this run. A token from a
            claim that is over -- given back, expired, or superseded by a fresh claim -- is
            refused with 403 even when it comes from the machine the run is assigned to.
      responses:
        "200":
          description: The source bytes
          headers:
            X-Source-Sha256:
              schema: { type: string }
              description: sha256 of the body, matching runs.source_hash
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: This run is not currently assigned to the calling judgehost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: No such run, or its source file is missing from storage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/runs/{run}/testcases:
    get:
      tags: [Judgehost]
      summary: Index of the test cases for a held run's problem (issue #53)
      description: >
        The index, not the data. Digests and sizes let an agent cache test
        cases across runs of the same problem -- the reason a judgehost is
        worth keeping warm -- and fetch only what it does not already hold.
        `bytes` is null when the file is missing from storage.
      security:
        - judgehostToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
        - name: X-Claim-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Issue #123. The claim_token fetch-work returned for this run. A token from a
            claim that is over -- given back, expired, or superseded by a fresh claim -- is
            refused with 403 even when it comes from the machine the run is assigned to.
      responses:
        "200":
          description: The problem's test cases, in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        number: { type: integer }
                        is_sample: { type: boolean }
                        input:
                          type: object
                          properties:
                            sha256: { type: string }
                            bytes: { type: integer, nullable: true }
                        output:
                          type: object
                          properties:
                            sha256: { type: string }
                            bytes: { type: integer, nullable: true }
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: This run is not currently assigned to the calling judgehost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/runs/{run}/testcases/{testCase}/{kind}:
    get:
      tags: [Judgehost]
      summary: One test case's input or expected output (issue #53)
      description: >
        `{testCase}` is checked against the held run's problem, not merely
        looked up by id. Without that, holding one trivial run would be
        enough to read the hidden test data of every problem in the system --
        which is what DOMjudge's equivalent endpoint allows.
      security:
        - judgehostToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
        - name: X-Claim-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Issue #123. The claim_token fetch-work returned for this run. A token from a
            claim that is over -- given back, expired, or superseded by a fresh claim -- is
            refused with 403 even when it comes from the machine the run is assigned to.
        - name: testCase
          in: path
          required: true
          schema: { type: integer }
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [input, output] }
      responses:
        "200":
          description: The test-case bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: >
            The run is not assigned to the caller, or the test case belongs to
            a different problem than the assigned run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: No such run or test case, or the file is missing from storage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/runs/{run}/package/{kind}:
    get:
      tags: [Judgehost]
      summary: One of the problem's custom scripts for a held run (issue #120)
      description: >
        The compile, run or compare script the problem overrides for this
        run's language. Without these a judgehost judges by the default rules
        a problem explicitly replaced -- and the compare hook is the one that
        matters most, since a problem with a tolerance checker judged by exact
        string comparison marks correct submissions WA, silently and in favour
        of the wrong answer.
        Scoped exactly like the test data, and resolved from the held run's
        own problem, so a path is never composed from anything the caller
        sent. 404 when the problem does not override that hook.
      security:
        - judgehostToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
        - name: X-Claim-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Issue #123. The claim_token fetch-work returned for this run. A token from a
            claim that is over -- given back, expired, or superseded by a fresh claim -- is
            refused with 403 even when it comes from the machine the run is assigned to.
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [compile, run, compare] }
      responses:
        "200":
          description: The script bytes
          headers:
            X-Script-Sha256:
              schema: { type: string }
              description: sha256 of the body, matching the fetch-work manifest
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: This run is not currently assigned to the calling judgehost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: No such run, or the problem does not override this hook for this language
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/runs/{run}/heartbeat:
    post:
      tags: [Judgehost]
      summary: Tell the server a judging is still running (issue #124)
      description: >
        Without this, a judging longer than the lease is reaped mid-flight and handed to
        another machine, which judges it and is reaped in turn -- the run is never
        finished, only repeatedly abandoned. Raising `lease_seconds` instead is not the
        same trade: the lease is also how long a run stays stuck when a machine really
        does die, so a lease long enough for the worst judging is a lease too long for a
        crash.
        Only `claimed_at` moves. It cannot change a status or a verdict, so the worst a
        confused agent can do with it is keep a run it already holds.
        The agent beats at about a third of the lease. PHP gives it no thread to beat
        from, so the judging loop yields between test cases instead: the longest silence
        is one test case, which is why the lease must exceed roughly three times the worst
        single test case.
      security:
        - judgehostToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
        - name: X-Claim-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Issue #123. The claim_token fetch-work returned for this run. A process that
            lost its claim must not be able to hold a run open for the process that has it.
      responses:
        "200":
          description: The lease was extended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id: { type: integer }
                      lease_seconds: { type: integer }
                      lease_expires_at: { type: string, format: date-time }
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: The run is not assigned to the caller, or the claim token is not current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: The run is no longer being judged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

  /remote-judges/v1/runs/{run}/result:
    post:
      tags: [Judgehost]
      summary: Report the verdict for a held run (issue #53)
      description: >
        The one judgehost endpoint that changes the standings. The verdict
        must be an answer short_name defined for this run's own contest --
        answers are per contest and installations rename them, so a free-form
        string would write answer_id = null and produce a run that is
        `judged` with no verdict, which the scoreboard silently reads as
        unsolved.
        Accepted only while the run is still `judging` and still leased to
        the caller, checked under a row lock in the same transaction as the
        write: a host whose lease expired mid-judging has already had its
        work handed to another machine, and its late answer must not
        overwrite the verdict of the machine that actually holds it.
        The verdict is recorded through the same path a local judging takes,
        so the scoreboard recompute, the first-solve balloon, and the
        contest-log entry all happen.
      security:
        - judgehostToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
        - name: X-Claim-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Issue #123. The claim_token fetch-work returned for this run. A token from a
            claim that is over -- given back, expired, or superseded by a fresh claim -- is
            refused with 403 even when it comes from the machine the run is assigned to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  maxLength: 10
                  description: An answers.short_name belonging to this run's contest
                message: { type: string, nullable: true, maxLength: 65535 }
                stdout: { type: string, nullable: true, maxLength: 65535 }
                stderr: { type: string, nullable: true, maxLength: 65535 }
      responses:
        "200":
          description: The verdict was recorded and the lease released
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id: { type: integer }
                      status: { type: string, example: judged }
                      verdict: { type: string }
                      answer_id: { type: integer, nullable: true }
                      replayed:
                        type: boolean
                        description: >
                          Issue #123. Present and true when this exact claim had already
                          reported: the verdict on record is returned unchanged rather than
                          rewritten. The network can drop after the server has written a
                          verdict and before the agent hears so, and an agent that retries
                          then is not doing anything wrong.
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: This run is not currently assigned to the calling judgehost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: >
            The run is no longer open -- judged by someone else, such as a jury member
            deciding it by hand while this host held it. A repeat of THIS claim's own
            report is a 200 replay instead (see `replayed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /remote-judges/v1/contests/{contest}/answers:
    get:
      tags: [Judgehost]
      summary: The verdict vocabulary of a contest (issue #53)
      description: >
        Answers are per contest and installations rename them, so an agent
        must not hardcode BOCA's set. Not scoped to a held run: it is the
        vocabulary, not anyone's work, and an agent needs it before it has
        claimed anything.
      security:
        - judgehostToken: []
      parameters:
        - name: contest
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The contest's answers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        short_name: { type: string }
                        name: { type: string }
                        is_accepted: { type: boolean }
        "401":
          description: Missing, unknown, or disabled judgehost token (indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: "Laravel Sanctum personal-access token, sent as `Authorization: Bearer <token>`."
    webcastCredential:
      type: http
      scheme: bearer
      description: >
        Issue #44 webcast credential secret, sent as `Authorization: Bearer
        <secret>`. Verified against webcast_credentials.token_hash by
        App\Http\Middleware\AuthenticateWebcastCredential -- entirely
        separate from Sanctum and from any `user_type`.

    judgehostToken:
      type: http
      scheme: bearer
      description: >
        Issue #53 judge-machine credential, sent as `Authorization: Bearer
        <token>`. Issued once by `php artisan judgehost:create` and stored
        only as a sha256 in judgehosts.token_hash, so the server cannot
        reveal it again. Verified by
        App\Http\Middleware\AuthenticateJudgehost -- entirely separate from
        Sanctum, from the webcast credential, and from any `user_type`. It
        grants no access to a run the holder is not currently leasing.

  parameters:
    ContestId:
      name: contest
      in: path
      required: true
      schema: { type: integer }
    ContestIdQuery:
      name: contest_id
      in: query
      required: false
      schema: { type: integer }
    ProblemId:
      name: problem
      in: path
      required: true
      schema: { type: integer }
    RunId:
      name: run
      in: path
      required: true
      schema: { type: integer }
    ClarificationId:
      name: clarification
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorMessage" }
    Forbidden:
      description: Authenticated, but not allowed to access this resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorMessage" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorMessage" }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    PackageScriptRef:
      type: object
      nullable: true
      description: >
        Issue #120. A custom script the problem defines for the run's
        language, or null when it does not override that hook. The digest is
        what makes an agent's cache safe: scripts are per problem and per
        language, so a host judging many runs of one problem fetches each
        once, and a re-imported package invalidates it by itself.
      properties:
        sha256: { type: string }
        bytes: { type: integer }
    ApiToken:
      type: object
      description: >
        A personal access token as the owner sees it. The secret is absent
        by construction -- the database keeps only its sha256 (#159).
      properties:
        id: { type: integer }
        name: { type: string }
        abilities:
          type: array
          items: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        current:
          type: boolean
          description: True for the token this request was authenticated with.
    ErrorMessage:
      type: object
      properties:
        message: { type: string }
        error: { type: string }

    WebcastWorkspace:
      type: object
      properties:
        data:
          type: object
          properties:
            contests:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
            contest:
              nullable: true
              type: object
              properties:
                id: { type: integer }
                name: { type: string }
            capabilities:
              type: object
              properties:
                can_export: { type: boolean }
                can_manage_credentials: { type: boolean }
            export_url: { type: string, nullable: true }
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  label: { type: string }
                  status: { type: string, enum: [active, expired, revoked] }
                  expires_at: { type: string, format: date-time }
                  last_used_at: { type: string, format: date-time, nullable: true }
            meta: { $ref: "#/components/schemas/PaginationMeta" }

    User:
      type: object
      properties:
        user_id: { type: integer }
        fullname: { type: string }
        email: { type: string }
        user_type: { type: string, enum: [admin, judge, team, staff, score, site, system] }
        site_id: { type: integer, nullable: true }

    Contest:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        start_time: { type: string, format: date-time, nullable: true }
        end_time: { type: string, format: date-time, nullable: true }
        duration: { type: integer, description: Minutes }
        freeze_time: { type: integer, description: Minutes before end that the scoreboard freezes }
        penalty: { type: integer, description: Minutes penalty per wrong attempt }
        max_file_size: { type: integer, description: KB }
        is_public: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContestCreate:
      type: object
      required: [name, duration, freeze_time, penalty, max_file_size]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
        start_time: { type: string, format: date-time, nullable: true }
        duration: { type: integer, minimum: 1, maximum: 10080 }
        freeze_time: { type: integer, minimum: 0 }
        penalty: { type: integer, minimum: 0, maximum: 120 }
        max_file_size: { type: integer, minimum: 1, maximum: 10240 }
        is_public: { type: boolean }

    ContestUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
        start_time: { type: string, format: date-time, nullable: true }
        duration: { type: integer, minimum: 1, maximum: 10080 }
        freeze_time: { type: integer, minimum: 0 }
        penalty: { type: integer, minimum: 0, maximum: 120 }
        max_file_size: { type: integer, minimum: 1, maximum: 10240 }
        is_active: { type: boolean }
        is_public: { type: boolean }

    Problem:
      type: object
      properties:
        id: { type: integer }
        contest_id: { type: integer }
        short_name: { type: string }
        name: { type: string }
        color_name: { type: string, nullable: true }
        color_hex: { type: string, nullable: true }
        time_limit: { type: integer, description: Seconds }
        memory_limit: { type: integer, description: MB }
        output_limit: { type: integer, description: KB }
        auto_judge: { type: boolean }
        sort_order: { type: integer }
        is_fake: { type: boolean }

    ProblemDetail:
      description: >
        What GET /problems/{problem} answers: the problem plus the three
        counts it loads. `test_cases_count` is deliberately the whole of
        what is said about the hidden cases on the competitor surface
        (issue #153) -- how long a judgement is, with no digest of the
        input or of the expected output attached.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            test_cases_count: { type: integer }
            runs_count: { type: integer }
            clarifications_count: { type: integer }
            contest: { $ref: "#/components/schemas/Contest" }

    ProblemTestCase:
      description: >
        Judge/admin material. input_hash/output_hash are sha256 of the
        hidden input and of the expected output, and input_file/output_file
        are their paths under the storage root.
      type: object
      properties:
        id: { type: integer }
        problem_id: { type: integer }
        number: { type: integer }
        input_file: { type: string }
        output_file: { type: string }
        input_hash: { type: string, nullable: true }
        output_hash: { type: string, nullable: true }
        is_sample: { type: boolean }

    ProblemUpdate:
      type: object
      properties:
        short_name: { type: string, maxLength: 10 }
        name: { type: string, maxLength: 200 }
        color_name: { type: string, maxLength: 50, nullable: true }
        color_hex: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
        time_limit: { type: integer, minimum: 1, maximum: 60 }
        memory_limit: { type: integer, minimum: 16, maximum: 2048 }
        output_limit: { type: integer, minimum: 1, maximum: 65536 }
        auto_judge: { type: boolean }
        sort_order: { type: integer, minimum: 0 }

    Run:
      type: object
      properties:
        id: { type: integer }
        contest_id: { type: integer }
        site_id: { type: integer }
        user_id: { type: integer }
        problem_id: { type: integer }
        language_id: { type: integer }
        answer_id: { type: integer, nullable: true }
        run_number: { type: integer }
        filename: { type: string }
        contest_time: { type: integer }
        status: { type: string, enum: [pending, judging, judged, rejudging, deleted] }
        judge_id: { type: integer, nullable: true }
        judged_time: { type: integer, nullable: true }
        auto_judge_result: { type: string, nullable: true }
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Issue #138. When a jury member released this verdict to the
            team, or null if nobody has. Only meaningful while the run's
            contest has verification_required set; with the gate off it
            stays null on every run and nothing reads it.

            For a caller who is not staff, a withheld run is returned with
            answer_id, judge_id, judged_time, auto_judge_result and these
            three verification fields all null and status reported as
            "judging" -- the verdict is not merely hidden from the body,
            the run is presented as still being evaluated, because it is.
        verified_by: { type: integer, nullable: true, description: "user_id of the jury member who verified (issue #138)." }
        verify_comment: { type: string, nullable: true, description: "Free-text note left by the verifier (issue #138)." }
        created_at: { type: string, format: date-time }

    Clarification:
      type: object
      properties:
        id: { type: integer }
        contest_id: { type: integer }
        site_id: { type: integer }
        user_id: { type: integer }
        problem_id: { type: integer, nullable: true }
        clarification_number: { type: integer }
        question: { type: string }
        answer: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, answered, broadcast_site, broadcast_all, deleted]
        contest_time: { type: integer }
        answered_time: { type: integer, nullable: true }
        judge_id: { type: integer, nullable: true }

    ScoreboardEntry:
      type: object
      properties:
        rank: { type: integer }
        user: { $ref: "#/components/schemas/User" }
        problems_solved: { type: integer }
        total_time: { type: integer }

    ScoreboardResponse:
      type: object
      properties:
        contest:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            is_running: { type: boolean }
            is_frozen: { type: boolean }
            start_time: { type: string, format: date-time, nullable: true }
            duration: { type: integer }
            penalty: { type: integer }
        problems:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              short_name: { type: string }
              name: { type: string }
              color_name: { type: string, nullable: true }
              color_hex: { type: string, nullable: true }
        scoreboard:
          type: array
          items:
            $ref: "#/components/schemas/ScoreboardEntry"
        updated_at: { type: string, format: date-time }

    MyScoreResponse:
      type: object
      properties:
        rank: { type: integer, nullable: true }
        problems_solved: { type: integer }
        total_time: { type: integer }
        problems:
          type: array
          items:
            type: object
            properties:
              problem_id: { type: integer }
              short_name: { type: string }
              name: { type: string }
              attempts: { type: integer }
              is_solved: { type: boolean }
              is_first_solver: { type: boolean }
              solved_time: { type: integer, nullable: true }
              penalty_time: { type: integer }
              total_time: { type: integer }

    ScoreboardExportJson:
      type: object
      properties:
        contest:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            start_time: { type: string, format: date-time, nullable: true }
            duration: { type: integer }
            penalty: { type: integer }
        scoreboard:
          type: array
          items:
            $ref: "#/components/schemas/ScoreboardEntry"
        exported_at: { type: string, format: date-time }

    ScoreboardExportIcpc:
      type: object
      properties:
        contest_id: { type: integer }
        contest_name: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer }
              team_id: { type: integer }
              team_name: { type: string }
              solved: { type: integer }
              time: { type: integer }

    PaginatedContests:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Contest" }

    PaginatedProblems:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Problem" }

    PaginatedRuns:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Run" }

    PaginatedClarifications:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Clarification" }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
