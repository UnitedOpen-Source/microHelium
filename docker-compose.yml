# Configuração compartilhada de ambiente para PHP
x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-microhelium}
  DB_USERNAME: ${DB_USERNAME:-microhelium}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  COMPOSER_MEMORY_LIMIT: -1
  DOCKER_UID: ${DOCKER_UID:-1000}
  DOCKER_GID: ${DOCKER_GID:-1000}

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: ${DOCKERFILE_APP:-Dockerfile}
      args:
        JUDGE_PROFILE: ${JUDGE_PROFILE:-maratona}
        WWW_UID: ${DOCKER_UID:-1000}
        WWW_GID: ${DOCKER_GID:-1000}
    image: microhelium-app:${IMAGE_TAG:-latest}
    container_name: microhelium-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *app-env
      PHP_OPCACHE_ENABLE: 1
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - microhelium
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: microhelium-webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
      - "${APP_SSL_PORT:-8443}:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - microhelium
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: microhelium-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-microhelium}
      MYSQL_USER: ${DB_USERNAME:-microhelium}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - microhelium-db:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - microhelium
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: microhelium-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - microhelium-redis:/data
    networks:
      - microhelium
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: ${DOCKERFILE_APP:-Dockerfile}
      args:
        JUDGE_PROFILE: ${JUDGE_PROFILE:-maratona}
        WWW_UID: ${DOCKER_UID:-1000}
        WWW_GID: ${DOCKER_GID:-1000}
    image: microhelium-app:${IMAGE_TAG:-latest}
    # No container_name: docker-compose.prod.yml scales this service to
    # multiple replicas, which Compose rejects when a fixed name is set
    # ("container name must be unique") -- previously invalid and never
    # exercised, since nothing had run `docker compose -f ... -f
    # docker-compose.prod.yml config` against it before issue #54.
    restart: unless-stopped
    working_dir: /var/www/html
    # No `user:` key, deliberately. This service judges -- queue:work runs
    # App\Jobs\JudgeRunJob, which calls AutoJudgeService::judge() to
    # compile and execute submitted contestant code -- and since issue #136
    # the image itself guarantees that happens as uid 1000, via
    # docker/php/entrypoint.sh. Pinning the uid here too would move the
    # guarantee back into the compose file, where it only protects people
    # who use this file. Do not add `user: root`: it would defeat the
    # entrypoint, which only drops privilege when it starts as root.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
    networks:
      - microhelium
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    privileged: true
    cap_add:
      - SYS_PTRACE

  # Scheduler (Cron)
  scheduler:
    build:
      context: .
      dockerfile: ${DOCKERFILE_APP:-Dockerfile}
      args:
        JUDGE_PROFILE: ${JUDGE_PROFILE:-maratona}
        WWW_UID: ${DOCKER_UID:-1000}
        WWW_GID: ${DOCKER_GID:-1000}
    image: microhelium-app:${IMAGE_TAG:-latest}
    container_name: microhelium-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    # Same exposure as `queue`, and it is not obvious: routes/console.php
    # schedules `runs:reconcile-stuck`, which dispatches JudgeRunJob. On a
    # sync queue connection that job runs inline, in THIS container. The
    # entrypoint drops the whole `/bin/sh -c ...` loop to uid 1000, so the
    # judging that reaches here is unprivileged too.
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
    networks:
      - microhelium
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    privileged: true
    cap_add:
      - SYS_PTRACE

  # Auto-Judge Worker
  autojudge:
    build:
      context: .
      dockerfile: ${DOCKERFILE_JUDGE:-Dockerfile.judge}
      args:
        JUDGE_PROFILE: ${JUDGE_PROFILE:-maratona}
    image: microhelium-judge:${IMAGE_TAG:-latest}
    container_name: microhelium-autojudge
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan autojudge:start --sleep=5
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
      - ./storage/app/judge:/var/www/html/storage/app/judge
      - ./storage/app/problems:/var/www/html/storage/app/problems
    networks:
      - microhelium
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    privileged: true
    cap_add:
      - SYS_PTRACE

  # Utilitário Composer (One-off CLI)
  composer:
    image: microhelium-app:${IMAGE_TAG:-latest}
    pull_policy: never
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      <<: *app-env
      HOME: /tmp
      COMPOSER_HOME: /tmp/.composer
      COMPOSER_CACHE_DIR: /tmp/.composer/cache
      COMPOSER_AUTH: ${COMPOSER_AUTH:-}
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/.composer/cache
    working_dir: /var/www/html
    entrypoint: ["composer"]
    command: ["list"]
    networks:
      - microhelium
    profiles:
      - cli

  # Utilitário Artisan (One-off CLI com dependências e rede)
  artisan:
    image: microhelium-app:${IMAGE_TAG:-latest}
    pull_policy: never
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["php", "artisan"]
    command: ["list"]
    networks:
      - microhelium
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - cli

  # Node.js for Development (Vite)
  node:
    # Issue #101: tests/Frontend/vue-loader.js uses module.registerHooks(),
    # which only exists from Node 22.15. On Node 20 features.test.js dies at
    # import time and eleven of the twenty-six frontend tests never run --
    # while `node --test` reports one failed file, not eleven missing tests.
    image: node:22-alpine
    container_name: microhelium-node
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /var/www/html
    environment:
      - HOME=/tmp
      - npm_config_cache=/tmp/.npm
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - microhelium
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - dev

  # phpMyAdmin (Optional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: microhelium-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-microhelium}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - microhelium
    depends_on:
      - db
    profiles:
      - tools

  # Mailpit (Local mail testing)
  mailpit:
    image: axllent/mailpit
    container_name: microhelium-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - microhelium
    profiles:
      - dev

networks:
  microhelium:
    driver: bridge

volumes:
  microhelium-db:
    driver: local
  microhelium-redis:
    driver: local
  composer-cache:
    driver: local
